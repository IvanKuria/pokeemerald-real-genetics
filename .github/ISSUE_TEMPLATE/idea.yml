name: Idea
description: A new genetics rule, a change to one of the rules, or anything else
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should change, and how would it play in the game?
    validations:
      required: true
  - type: textarea
    id: science
    attributes:
      label: The real science behind it
      description: If it's based on real genetics or biology, link the paper or article.
  - type: textarea
    id: extra
    attributes:
      label: Anything else

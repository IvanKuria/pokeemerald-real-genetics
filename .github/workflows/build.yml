name: CI

# Builds the mod on every push and pull request, checks that the vanilla build still matches retail
# Emerald, makes the .bps patch and checks that it rebuilds the modded ROM exactly. The patch is
# uploaded as a workflow artifact. Releases are handled by release.yml.

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # make_patch.sh needs the history to find the upstream base commit

      - name: Checkout agbcc
        uses: actions/checkout@v4
        with:
          path: agbcc
          repository: pret/agbcc

      - name: Install binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev
        # build-essential and git are already installed
        # gcc-arm-none-eabi is only needed for the modern build

      - name: Install agbcc
        run: |
          ./build.sh
          ./install.sh ../
        working-directory: agbcc

      - name: Fetch upstream pokeemerald
        run: |
          git remote add upstream https://github.com/pret/pokeemerald.git || git remote set-url upstream https://github.com/pret/pokeemerald.git
          git fetch --no-tags upstream master

      - name: Test the BPS encoder and decoder
        run: python3 tools/realgen/test_bps.py

      - name: Build vanilla and modded ROMs, make and verify the patch
        run: REALGEN_MAKE="make -j$(nproc)" tools/realgen/make_patch.sh

      - name: Upload the patch
        uses: actions/upload-artifact@v4
        with:
          name: real-genetics-patch
          path: dist/*.bps
          if-no-files-found: error

      - name: Modern compiler build
        env:
          MODERN: 1
        run: make -j$(nproc) all
